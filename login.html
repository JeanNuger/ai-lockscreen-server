<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>AI Lock Screen — вход</title>
<style>
  body { font-family: system-ui, sans-serif; background: #1a1a1a; color: #eee;
         display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
  form { background: #242424; padding: 32px; border-radius: 12px; width: 280px; }
  h1 { font-size: 18px; margin: 0 0 20px; }
  label { display: block; font-size: 13px; margin-bottom: 4px; color: #aaa; }
  input { width: 100%; box-sizing: border-box; padding: 10px; margin-bottom: 14px;
          border-radius: 6px; border: 1px solid #3a3a3a; background: #1a1a1a; color: #eee; }
  button { width: 100%; padding: 10px; border-radius: 6px; border: none;
           background: #1B6CF7; color: white; font-weight: bold; cursor: pointer; }
  button:hover { background: #0D3A8C; }
  #error { color: #ff6b6b; font-size: 13px; margin-bottom: 12px; display: none; }
</style>
</head>
<body>
<form id="loginForm">
  <h1>AI Lock Screen — админ</h1>
  <div id="error"></div>
  <label for="username">Логин</label>
  <input type="text" id="username" autocomplete="username" required>
  <label for="password">Пароль</label>
  <input type="password" id="password" autocomplete="current-password" required>
  <button type="submit">Войти</button>
</form>
<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errorEl = document.getElementById('error');
  errorEl.style.display = 'none';
  try {
    const res = await fetch('/admin/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        username: document.getElementById('username').value,
        password: document.getElementById('password').value,
      }),
    });
    if (res.ok) {
      window.location.href = '/admin/dashboard';
    } else {
      const data = await res.json().catch(() => ({}));
      errorEl.textContent = data.error || 'Ошибка входа';
      errorEl.style.display = 'block';
    }
  } catch (err) {
    errorEl.textContent = 'Не удалось связаться с сервером';
    errorEl.style.display = 'block';
  }
});
</script>
</body>
</html>
